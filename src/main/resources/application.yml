spring:
  application:
    name: marcura-exchange-rate-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marcura_exchange_rate}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:llama3.2}

# Fixer.io configuration
fixer:
  api:
    base-url: ${FIXER_BASE_URL:http://data.fixer.io/api}
    key: ${FIXER_API_KEY:your_fixer_api_key_here}
    timeout: 10000

# OpenAPI/Swagger configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# Scheduler configuration
scheduler:
  rate-collection:
    cron: "0 5 0 * * ?"
    zone: UTC

# Logging
logging:
  level:
    root: INFO
    com.example.marcuraexchangeratebackend: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
